[pytest]
# Minimal config. Hardware/slow tests are opt-in (require a real audio
# device or model download); default run is fast and offline.
markers =
    hardware: needs a real audio device (Windows WASAPI); skipped by default
    slow: downloads/loads the Whisper model; run on demand
addopts = -q -m "not hardware and not slow" --ignore=tests/test_capture.py
testpaths = tests

# Note: tests/test_capture.py is the pre-existing standalone live-capture
# test. It needs a real device or PSYCHAI_FAKE_AUDIO=1, so it is excluded
# from the default fast run. Run it explicitly:
#   PSYCHAI_FAKE_AUDIO=1 pytest tests/test_capture.py
